# Deploys the Birdman server (server/) to Cloudflare whenever it, or the shared code it uses, changes.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Without them it skips.
name: Deploy server

on:
  push:
    branches: [main]
    paths: ['server/**', 'src/espn.ts', 'src/bets.ts', 'src/grader.ts', 'src/market.ts', 'src/stats.ts', 'src/store.ts', 'src/recordhash.ts']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Cloudflare secrets
        id: ready
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      # The server reuses the app's grading code, so it needs the app's packages too.
      - run: npm ci
        if: steps.ready.outputs.ok == 'true'
      - run: npm install --no-audit --no-fund
        if: steps.ready.outputs.ok == 'true'
        working-directory: server
      - run: npm test
        if: steps.ready.outputs.ok == 'true'
        working-directory: server
      - run: npx wrangler d1 execute birdman --remote --file=schema.sql
        if: steps.ready.outputs.ok == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        if: steps.ready.outputs.ok == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
