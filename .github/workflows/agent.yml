# The Birdman pick agent: scans today's games and posts up to 3 picks a day to the public record.
# Runs around noon, 5 PM and 7 PM Eastern. Needs the SERVER_URL variable and the AGENT_KEY secret.
name: Pick agent

on:
  schedule:
    - cron: '15 17,22 * * *'
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (show picks, post nothing)'
        type: boolean
        default: false

concurrency:
  group: pick-agent
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/run-agent.mjs ${{ inputs.dry && '--dry' || '' }}
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
